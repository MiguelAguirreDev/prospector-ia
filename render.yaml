services:
  - type: web
    name: prospector-ia-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PROSPECTOR_MAPS_HEADLESS
        value: "1"
      - key: PORT
        value: "3000"
    healthCheckPath: /api/estado
