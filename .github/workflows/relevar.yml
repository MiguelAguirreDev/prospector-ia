name: Relevar empresas (nube)

# Corre en los servidores de GitHub: tu PC puede estar apagada.
# Requiere subir el proyecto a GitHub y cargar los secretos:
#   OPENROUTER_API_KEY, NVIDIA_API_KEY (Settings -> Secrets and variables -> Actions)

on:
  schedule:
    - cron: "0 6 * * *" # todos los días 06:00 UTC (03:00 en Uruguay aprox.)
  workflow_dispatch: {} # permite dispararlo a mano desde la web

permissions:
  contents: write # para guardar la base (memoria anti-repetición) en el repo

jobs:
  relevar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Relevar (rotando consultas)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: bash run_cron.sh

      - name: Subir resultados (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            salida/empresas.csv
            salida/emails/

      - name: Guardar estado (base de datos) en el repo
        run: |
          git config user.name "prospector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add datos/prospector.db salida/ 2>/dev/null || true
          git commit -m "datos: $(date -u +%F)" || echo "sin cambios"
          git push || echo "no se pudo subir (revisá permisos)"
